global
    maxconn 256
    log stdout format raw local0
    chroot      /usr/share/haproxy
    pidfile     /run/haproxy
    daemon

    ssl-default-bind-options ssl-min-ver TLSv1.2


defaults
    log global
    mode tcp

    timeout connect 3s
    timeout client 8h
    timeout server 8h

# ---------------------------------------------------------------------------
# Public endpoint
#
# Browser:
#   TLS + ALPN h2/http1.1 -> 404
#
# node-tunnel:
#   TLS + NO ALPN -> node-tunnel backend. NO ALPN to have better compatibility on restrictive networks.
#
# Note: node-tunnel is the fallback TLS protocol, rather than HAProxy positively identifying a no-ALPN client.
# ---------------------------------------------------------------------------

frontend public_tls
    mode tcp

    bind :443 ssl crt /path/to/your/cert.pem alpn h2,http/1.1

    # Track each source IP:
    # - how many connections it currently has
    # - how many new connections it created in the last 10 seconds
    stick-table type ip size 10k expire 10m store conn_cur,conn_rate(10s)

    tcp-request connection track-sc0 src

    # Max 32 simultaneous connections from one IP.
    tcp-request connection reject if { sc_conn_cur(0) gt 32 }

    # Max 32 newly-created connections per IP in 10 seconds.
    tcp-request connection reject if { sc_conn_rate(0) gt 32 }

    # Browser traffic.
    use_backend browser_h2 if { ssl_fc_alpn -i h2 }
    use_backend browser_http1 if { ssl_fc_alpn -i http/1.1 }

    # No ALPN -> node-tunnel.
    default_backend node_tunnel

# ---------------------------------------------------------------------------
# node-tunnel
# ---------------------------------------------------------------------------

backend node_tunnel
    mode tcp

    server node_tunnel_local 127.0.0.1:1337

# ---------------------------------------------------------------------------
# Browser HTTP/1.1 -> internal HAProxy endpoint
# ---------------------------------------------------------------------------

backend browser_http1
    mode tcp

    server browser_http1_local 127.0.0.1:18081

frontend browser_http1_response
    bind 127.0.0.1:18081
    mode http

    http-request return status 404 content-type text/plain string "Not Found"

# ---------------------------------------------------------------------------
# Browser HTTP/2 -> internal HAProxy h2c endpoint
#
# The outer TLS connection has already been decrypted by public_tls.
# The browser's HTTP/2 bytes are forwarded here as cleartext H2.
# ---------------------------------------------------------------------------

backend browser_h2
    mode tcp

    server browser_h2_local 127.0.0.1:18082

frontend browser_h2_response
    bind 127.0.0.1:18082 proto h2
    mode http

    http-request return status 404 content-type text/plain string "Not Found"
