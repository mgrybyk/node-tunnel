name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-tests: ${{ steps.filter.outputs.run-tests }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether checks are needed
        id: filter
        shell: bash
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process')
          const { readFileSync, appendFileSync } = require('node:fs')
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'))
          const pr = event.pull_request
          const base = pr ? pr.base.sha : event.before
          const head = pr ? pr.head.sha : process.env.GITHUB_SHA
          let runTests = true

          if (base && !/^0+$/.test(base)) {
            try {
              // PRs compare against the merge base; pushes compare the entire pushed range.
              // Disable rename detection so moving code into an ignored path still runs checks.
              const range = `${base}${pr ? '...' : '..'}${head}`
              const files = execFileSync('git', ['diff', '--no-renames', '--name-only', '-z', range], {
                encoding: 'utf8'
              }).split('\0').filter(Boolean)
              const ignored = file => file.startsWith('benchmark/') || file.startsWith('docs/') ||
                file.endsWith('.md') || file.endsWith('.env') || file === 'LICENSE'
              runTests = files.some(file => !ignored(file))
            } catch (error) {
              // Run checks conservatively if a force push makes the old commit unavailable.
              console.warn(`Could not determine changed files; running checks: ${error.message}`)
            }
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `run-tests=${runTests}\n`)
          console.log(runTests ? 'Checks required.' : 'Only excluded paths changed; skipping checks.')
          NODE

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.run-tests == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax, lint, and formatting
        run: npm run check

      - name: Test with coverage
        run: npm run test:coverage

  rust-client:
    name: Test Rust client (native and WASM)
    needs: changes
    if: needs.changes.outputs.run-tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test native Rust client
        working-directory: rust
        run: cargo test --locked

      - name: Build and link native C ABI
        working-directory: rust
        run: |
          cargo build --locked --release
          cc -std=c11 -Wall -Wextra -Werror -Iinclude tests/native_smoke.c \
            -Ltarget/release -lnode_tunnel_client -Wl,-rpath,"$PWD/target/release" -o target/native-smoke
          target/native-smoke

      - name: Build WASM
        run: npm run build:wasm

      - name: Run Rust client interoperability tests
        run: npm run test:rust

  status:
    name: CI status
    needs: [changes, test, rust-client]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_TESTS: ${{ needs.changes.outputs.run-tests }}
          TEST_RESULT: ${{ needs.test.result }}
          RUST_RESULT: ${{ needs.rust-client.result }}
        run: |
          if [[ "$CHANGES_RESULT" == 'success' ]] &&
             { [[ "$RUN_TESTS" == 'false' && "$TEST_RESULT" == 'skipped' && "$RUST_RESULT" == 'skipped' ]] ||
               [[ "$RUN_TESTS" == 'true' && "$TEST_RESULT" == 'success' && "$RUST_RESULT" == 'success' ]]; }; then
            echo 'CI passed.'
          else
            echo 'CI failed or was cancelled.'
            exit 1
          fi
